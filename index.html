<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PIXA · Year in Pixels</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2225%22 fill=%22%23b492cd%22/><text x=%2250%22 y=%2255%22 font-size=%2250%22 text-anchor=%22middle%22 dominant-baseline=%22central%22>🟩</text></svg>">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }

    body {
      background-color: #f7faf8;
      color: #2c3e35;
      min-height: 100vh;
      margin: 0;
      padding-bottom: 70px;
    }

    .pixel-cell {
      width: 100%;
      max-width: 20px;
      max-height: 20px;
      aspect-ratio: 1 / 1;
      border-radius: 3px;
      margin: 0 auto;
      transition: transform 0.1s ease;
    }
    .pixel-cell:active {
      transform: scale(0.85);
    }
    .pixel-empty {
      background-color: #e5ece8;
    }

    .modal-overlay {
      background-color: rgba(44, 62, 53, 0.4);
      backdrop-filter: blur(4px);
    }

    ::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="flex flex-col antialiased">

  <header class="sticky top-0 bg-[#f7faf8]/95 backdrop-blur-md z-30 px-4 py-3 border-b border-[#e2ede7] flex items-center justify-between">
    <div class="flex items-center space-x-2">
      <button id="btn-back" onclick="goHome()" class="hidden text-stone-500 font-extrabold text-lg mr-1">‹</button>
      <div class="flex items-center space-x-1.5">
        <span class="w-6 h-6 rounded-lg bg-emerald-100 flex items-center justify-center text-xs">🟩</span>
        <h1 class="text-sm font-black tracking-wide text-stone-800" id="header-title">PIXA</h1>
      </div>
    </div>

    <div class="flex items-center space-x-3 text-xs font-bold text-stone-600">
      <div class="flex items-center space-x-1 bg-white px-2 py-1 rounded-xl border border-[#e2ede7] shadow-xs">
        <button onclick="changeYear(-1)" class="px-1 text-stone-400 font-black">‹</button>
        <span id="current-year-label" class="font-black text-stone-800">2026</span>
        <button onclick="changeYear(1)" class="px-1 text-stone-400 font-black">›</button>
      </div>
      <button id="btn-toggle-view" onclick="toggleViewMode()" class="hidden bg-white px-2.5 py-1 rounded-xl border border-[#e2ede7] shadow-xs">📅</button>
    </div>
  </header>

  <main class="flex-1 max-w-lg mx-auto w-full p-4">

    <section id="screen-home" class="space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="text-xs font-black uppercase tracking-wider text-stone-500">Mis Registros en Píxeles</h2>
        <button onclick="openNewTrackerModal()" class="px-3 py-1 bg-[#5fa89b] text-white rounded-xl text-xs font-black shadow-sm">+ Nuevo Log</button>
      </div>

      <div id="trackers-grid" class="grid grid-cols-2 gap-3">
        </div>
    </section>

    <section id="screen-detail" class="hidden space-y-4">
      <div class="flex items-center justify-between">
        <input type="text" id="detail-title" onchange="updateTrackerTitle(this.value)" class="bg-transparent text-lg font-black text-stone-800 outline-none w-2/3">
        <div class="flex items-center space-x-2">
          <button onclick="openAddKeyModal()" class="px-2.5 py-1 bg-white border border-[#e2ede7] rounded-xl text-xs font-bold text-stone-700 shadow-xs">+ Color</button>
          <button onclick="deleteCurrentTracker()" class="text-red-400 font-bold text-xs p-1">🗑️</button>
        </div>
      </div>

      <div id="tracker-keys-container" class="flex flex-wrap gap-2 pt-1 pb-2">
        </div>

      <div id="view-pixel-grid" class="bg-white p-3.5 rounded-3xl border border-[#e2ede7] shadow-xs space-y-2 overflow-x-auto">
        <div class="min-w-[320px]">
          <div class="grid grid-cols-13 gap-1 text-center text-[10px] font-black text-stone-400 mb-1">
            <div></div>
            <div>J</div><div>F</div><div>M</div><div>A</div><div>M</div><div>J</div>
            <div>J</div><div>A</div><div>S</div><div>O</div><div>N</div><div>D</div>
          </div>
          <div id="pixel-rows" class="space-y-1">
            </div>
        </div>
      </div>

      <div id="view-calendar-grid" class="hidden space-y-4">
        </div>
    </section>

  </main>

  <div id="modal-pick-color" class="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay hidden">
    <div class="bg-white rounded-3xl max-w-xs w-full p-5 space-y-4 shadow-2xl border border-[#e2ede7]">
      <div class="text-center">
        <span id="pick-date-label" class="text-xs font-black uppercase text-stone-400">Sep 15</span>
        <h3 class="text-sm font-black text-stone-800">Selecciona el color del día</h3>
      </div>
      <div id="modal-keys-list" class="space-y-2 max-h-60 overflow-y-auto pr-1">
        </div>
      <div class="flex justify-between pt-2 border-t border-[#e2ede7]">
        <button onclick="clearPixelDay()" class="text-xs font-bold text-red-500">Borrar color</button>
        <button onclick="closeModal('modal-pick-color')" class="px-4 py-1.5 bg-stone-100 rounded-xl text-xs font-bold text-stone-700">Listo</button>
      </div>
    </div>
  </div>

  <div id="modal-key-edit" class="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay hidden">
    <div class="bg-white rounded-3xl max-w-xs w-full p-5 space-y-4 shadow-2xl border border-[#e2ede7]">
      <h3 class="text-sm font-black text-stone-800 text-center">Configurar Etiqueta</h3>
      <div class="space-y-3">
        <div>
          <label class="text-[10px] font-black uppercase text-stone-400 block mb-1">Nombre / Rango</label>
          <input type="text" id="key-input-label" placeholder="Ej. 5k-6k pasos, Alta, etc." class="w-full bg-[#f7faf8] border border-[#e2ede7] rounded-xl px-3 py-2 text-xs font-bold text-stone-800">
        </div>
        <div>
          <label class="text-[10px] font-black uppercase text-stone-400 block mb-1">Elige un Color</label>
          <div class="flex items-center space-x-2">
            <input type="color" id="key-input-color" value="#b492cd" class="w-10 h-10 rounded-xl border-none cursor-pointer">
            <span id="key-color-hex" class="text-xs font-bold text-stone-500">#b492cd</span>
          </div>
        </div>
      </div>
      <div class="flex justify-end space-x-2 pt-2">
        <button onclick="closeModal('modal-key-edit')" class="px-3 py-1.5 text-xs font-bold text-stone-500">Cancelar</button>
        <button onclick="saveKeyItem()" class="px-4 py-1.5 bg-[#5fa89b] text-white rounded-xl text-xs font-black">Guardar</button>
      </div>
    </div>
  </div>

  <div id="modal-new-tracker" class="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay hidden">
    <div class="bg-white rounded-3xl max-w-xs w-full p-5 space-y-4 shadow-2xl border border-[#e2ede7]">
      <h3 class="text-sm font-black text-stone-800 text-center">Nuevo Registro</h3>
      <div>
        <label class="text-[10px] font-black uppercase text-stone-400 block mb-1">Nombre del Log</label>
        <input type="text" id="new-tracker-name" placeholder="Ej. Pasos, Energía, Agua..." class="w-full bg-[#f7faf8] border border-[#e2ede7] rounded-xl px-3 py-2 text-xs font-bold text-stone-800">
      </div>
      <div class="flex justify-end space-x-2 pt-2">
        <button onclick="closeModal('modal-new-tracker')" class="px-3 py-1.5 text-xs font-bold text-stone-500">Cancelar</button>
        <button onclick="createNewTracker()" class="px-4 py-1.5 bg-[#5fa89b] text-white rounded-xl text-xs font-black">Crear</button>
      </div>
    </div>
  </div>
