<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PIXA · Year in Pixels</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase SDKs (Firestore) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2225%22 fill=%22%23b492cd%22/><text x=%2250%22 y=%2255%22 font-size=%2250%22 text-anchor=%22middle%22 dominant-baseline=%22central%22>🌸</text></svg>">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }

    body {
      background: 
        radial-gradient(circle at 10% 15%, rgba(217, 167, 199, 0.22) 0%, transparent 40%),
        radial-gradient(circle at 90% 85%, rgba(180, 146, 205, 0.22) 0%, transparent 45%),
        linear-gradient(135deg, #fcf8fa 0%, #f7f1f5 50%, #f3ecf5 100%);
      color: #3d2c3d;
      min-height: 100vh;
      margin: 0;
      padding-bottom: 90px;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(217, 167, 199, 0.4);
      box-shadow: 0 10px 30px rgba(120, 80, 100, 0.06);
    }

    .pixel-cell {
      width: 100%;
      max-width: 22px;
      max-height: 22px;
      aspect-ratio: 1 / 1;
      border-radius: 4px;
      margin: 0 auto;
      transition: transform 0.1s ease;
      cursor: pointer;
    }
    .pixel-cell:active { transform: scale(0.85); }
    .pixel-empty { background-color: #ebd7e3; opacity: 0.4; }

    .pixel-today {
      box-shadow: 0 0 0 2.5px #b492cd, 0 0 6px rgba(180, 146, 205, 0.8);
      position: relative;
      z-index: 10;
    }

    .modal-overlay {
      background-color: rgba(61, 44, 61, 0.45);
      backdrop-filter: blur(6px);
    }

    .nav-tab {
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .nav-tab.active {
      background: linear-gradient(135deg, #b492cd 0%, #c879a8) !important;
      color: #ffffff !important;
      font-weight: 800;
      box-shadow: 0 4px 15px rgba(180, 146, 205, 0.4);
    }

    .donut-hole {
      background: #ffffff;
      border-radius: 50%;
      width: 68px;
      height: 68px;
    }

    ::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="flex flex-col antialiased">

  <!-- TOP BAR -->
  <header class="sticky top-0 bg-white/95 backdrop-blur-md z-40 px-4 py-3 border-b border-[#ebd7e3] flex items-center justify-between">
    <div class="flex items-center space-x-2">
      <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-[#b492cd] to-[#d9a7c7] flex items-center justify-center text-xs shadow-sm">🌸</div>
      <div>
        <h1 class="text-xs font-black tracking-wider uppercase text-stone-800">PIXA <span class="text-[#c879a8]">YEAR IN PIXELS</span></h1>
        <p class="text-[9px] font-bold text-stone-400">Mis registros vitales</p>
      </div>
    </div>

    <div class="flex items-center space-x-2 text-xs font-bold text-stone-600">
      <div class="flex items-center space-x-1 bg-white px-2.5 py-1 rounded-xl border border-[#ebd7e3] shadow-xs">
        <button onclick="changeYear(-1)" class="px-1 text-stone-400 font-black cursor-pointer">‹</button>
        <span id="current-year-label" class="font-black text-stone-800">2026</span>
        <button onclick="changeYear(1)" class="px-1 text-stone-400 font-black cursor-pointer">›</button>
      </div>
    </div>
  </header>

  <!-- SELECTOR DE TRACKERS (CARRUSEL SUPERIOR) -->
  <div class="bg-white/60 backdrop-blur-xs border-b border-[#ebd7e3] px-4 py-2 overflow-x-auto flex space-x-2 sticky top-[57px] z-30" id="trackers-pills-bar">
    <!-- Generado por JS -->
  </div>

  <!-- CONTENEDOR PRINCIPAL -->
  <main class="flex-1 max-w-lg mx-auto w-full p-4 space-y-4">

    <!-- VISTA 1: GRILLA DE PÍXELES -->
    <section id="view-pixels" class="space-y-4">
      <div class="glass-card rounded-3xl p-4 space-y-3">
        <div class="flex items-center justify-between pb-2 border-b border-[#ebd7e3]">
          <div class="flex items-center space-x-2">
            <input type="text" id="active-tracker-title" onchange="updateTrackerTitle(this.value)" class="bg-transparent text-sm font-black text-stone-800 outline-none w-40">
            <span id="active-tracker-count" class="text-[10px] font-bold text-stone-400">0 días</span>
          </div>
          <div class="flex items-center space-x-1.5">
            <button onclick="openAddKeyModal()" class="px-2.5 py-1 bg-[#f7f0f4] border border-[#ebd7e3] rounded-xl text-[11px] font-bold text-[#b492cd] cursor-pointer">+ Color</button>
            <button onclick="openNewTrackerModal()" class="px-2.5 py-1 bg-[#b492cd] text-white rounded-xl text-[11px] font-black shadow-xs cursor-pointer">+ Log</button>
            <button onclick="deleteCurrentTracker()" class="text-red-400 font-bold text-xs p-1 cursor-pointer" title="Eliminar log">🗑️</button>
          </div>
        </div>

        <!-- Leyenda de colores -->
        <div id="tracker-keys-container" class="flex flex-wrap gap-1.5 pt-1">
          <!-- Generado por JS -->
        </div>
      </div>

      <!-- TABLA ANUAL COMPLETA -->
      <div class="glass-card rounded-3xl p-4 space-y-2 overflow-x-auto">
        <div class="min-w-[320px]">
          <div style="display: grid; grid-template-columns: repeat(13, minmax(0, 1fr)); gap: 3px; align-items: center;" class="text-center text-[10px] font-black text-stone-400 mb-1">
            <div></div>
            <div>J</div><div>F</div><div>M</div><div>A</div><div>M</div><div>J</div>
            <div>J</div><div>A</div><div>S</div><div>O</div><div>N</div><div>D</div>
          </div>
          <div id="pixel-rows" class="space-y-1">
            <!-- 31 filas generadas por JS -->
          </div>
        </div>
      </div>
    </section>

    <!-- VISTA 2: ESTADÍSTICAS VISUALES (TORTAS Y BARRAS) -->
    <section id="view-stats" class="space-y-4 hidden">
      <div class="glass-card rounded-3xl p-4 space-y-3">
        <h3 class="text-xs font-black uppercase tracking-wider text-stone-700">📊 Resumen y Gráficos</h3>
        <div class="grid grid-cols-2 gap-2 text-xs">
          <div>
            <label class="font-bold text-stone-500 text-[10px] block mb-1">Desde</label>
            <input type="date" id="stats-from" onchange="renderStats()" class="w-full bg-white border border-[#ebd7e3] rounded-xl px-2.5 py-1.5 font-bold text-stone-700">
          </div>
          <div>
            <label class="font-bold text-stone-500 text-[10px] block mb-1">Hasta</label>
            <input type="date" id="stats-to" onchange="renderStats()" class="w-full bg-white border border-[#ebd7e3] rounded-xl px-2.5 py-1.5 font-bold text-stone-700">
          </div>
        </div>
      </div>

      <!-- TARJETA DE GRÁFICO TIPO DONA / TORTA Y MÉTRICAS -->
      <div class="glass-card rounded-3xl p-5 space-y-4">
        <div class="flex items-center justify-between">
          <div>
            <span class="text-[10px] font-black uppercase text-stone-400">Distribución</span>
            <h4 class="text-sm font-black text-stone-800" id="stats-tracker-name-title">Pasos</h4>
          </div>
          <span id="stats-total-logged-badge" class="px-2.5 py-1 bg-[#f7f0f4] text-[#b492cd] rounded-xl text-xs font-black">0 días reg.</span>
        </div>

        <!-- Gráfico Dona / Torta central -->
        <div class="flex flex-col items-center justify-center py-2">
          <div id="donut-chart-container" class="relative w-32 h-32 rounded-full flex items-center justify-center shadow-inner">
            <div class="donut-hole absolute flex flex-col items-center justify-center shadow-xs">
              <span id="donut-center-pct" class="text-xs font-black text-stone-800">100%</span>
              <span class="text-[8px] font-bold text-stone-400 uppercase">Activo</span>
            </div>
          </div>
        </div>

        <!-- Desglose con Barras de Progreso -->
        <div id="stats-breakdown-container" class="space-y-3 pt-2">
          <!-- Generado por JS -->
        </div>
      </div>
    </section>

  </main>

  <!-- BARRA DE NAVEGACIÓN INFERIOR (TIPO APP) -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-[#ebd7e3] p-2 flex justify-around items-center z-50 shadow-lg">
    <button onclick="switchMainTab('pixels')" id="nav-tab-pixels" class="nav-tab active flex-1 py-2 rounded-2xl text-xs font-bold text-stone-600 flex flex-col items-center justify-center cursor-pointer">
      <span>🟩 Píxeles</span>
    </button>
    <button onclick="switchMainTab('stats')" id="nav-tab-stats" class="nav-tab flex-1 py-2 rounded-2xl text-xs font-bold text-stone-600 flex flex-col items-center justify-center cursor-pointer">
      <span>📊 Estadísticas</span>
    </button>
  </nav>

  <!-- TOAST DE CONFIRMACIÓN -->
  <div id="toast" class="fixed bottom-20 left-1/2 transform -translate-x-1/2 z-50 bg-[#3d2c3d] text-white px-4 py-2 rounded-2xl shadow-xl text-xs font-bold transition-all duration-300 opacity-0 pointer-events-none">
    ✨ ¡Guardado con éxito!
  </div>

  <!-- MODAL: PINTAR PÍXEL -->
  <div id="modal-pick-color" class="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay hidden">
    <div class="bg-white rounded-3xl max-w-xs w-full p-5 space-y-4 shadow-2xl border border-[#ebd7e3]">
      <div class="text-center">
        <span id="pick-date-label" class="text-xs font-black uppercase text-stone-400">Sep 15</span>
        <h3 class="text-sm font-black text-stone-800">Selecciona el color del día</h3>
      </div>
      <div id="modal-keys-list" class="space-y-2 max-h-60 overflow-y-auto pr-1"></div>
      <div class="flex justify-between pt-2 border-t border-[#ebd7e3]">
        <button onclick="clearPixelDay()" class="text-xs font-bold text-red-500 cursor-pointer">Borrar color</button>
        <button onclick="closeModal('modal-pick-color')" class="px-4 py-1.5 bg-stone-100 rounded-xl text-xs font-bold text-stone-700 cursor-pointer">Listo</button>
      </div>
    </div>
  </div>

  <!-- MODAL: NUEVA CATEGORÍA (COLOR) -->
  <div id="modal-key-edit" class="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay hidden">
    <div class="bg-white rounded-3xl max-w-xs w-full p-5 space-y-4 shadow-2xl border border-[#ebd7e3]">
      <h3 class="text-sm font-black text-stone-800 text-center">Nueva Categoría</h3>
      <div class="space-y-3">
        <div>
          <label class="text-[10px] font-black uppercase text-stone-400 block mb-1">Nombre / Rango</label>
          <input type="text" id="key-input-label" placeholder="Ej. Alta, 5k pasos..." class="w-full bg-[#f7faf8] border border-[#ebd7e3] rounded-xl px-3 py-2 text-xs font-bold text-stone-800">
        </div>
        <div>
          <label class="text-[10px] font-black uppercase text-stone-400 block mb-1">Color</label>
          <div class="flex items-center space-x-2">
            <input type="color" id="key-input-color" value="#b492cd" class="w-10 h-10 rounded-xl border-none cursor-pointer">
            <span id="key-color-hex" class="text-xs font-bold text-stone-500">#b492cd</span>
          </div>
        </div>
      </div>
      <div class="flex justify-end space-x-2 pt-2">
        <button onclick="closeModal('modal-key-edit')" class="px-3 py-1.5 text-xs font-bold text-stone-500 cursor-pointer">Cancelar</button>
        <button onclick="saveKeyItem()" class="px-4 py-1.5 bg-[#b492cd] text-white rounded-xl text-xs font-black cursor-pointer">Guardar</button>
      </div>
    </div>
  </div>

  <!-- MODAL: NUEVO TRACKER -->
  <div id="modal-new-tracker" class="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay hidden">
    <div class="bg-white rounded-3xl max-w-xs w-full p-5 space-y-4 shadow-2xl border border-[#ebd7e3]">
      <h3 class="text-sm font-black text-stone-800 text-center">Nuevo Registro</h3>
      <div>
        <label class="text-[10px] font-black uppercase text-stone-400 block mb-1">Nombre del Log</label>
        <input type="text" id="new-tracker-name" placeholder="Ej. Sueño, Energía, Lectura..." class="w-full bg-[#f7faf8] border border-[#ebd7e3] rounded-xl px-3 py-2 text-xs font-bold text-stone-800">
      </div>
      <div class="flex justify-end space-x-2 pt-2">
        <button onclick="closeModal('modal-new-tracker')" class="px-3 py-1.5 text-xs font-bold text-stone-500 cursor-pointer">Cancelar</button>
        <button onclick="createNewTracker()" class="px-4 py-1.5 bg-[#b492cd] text-white rounded-xl text-xs font-black cursor-pointer">Crear</button>
      </div>
    </div>
  </div>

  <!-- SCRIPT -->
  <script>
    // Configuración Firebase Firestore con tus credenciales reales
    const firebaseConfig = {
      apiKey: "AIzaSyCnhvfyXpwJdYOQFCvsyHDhgW9F3X7ARR4",
      authDomain: "marpk-816dd.firebaseapp.com",
      databaseURL: "https://marpk-816dd-default-rtdb.firebaseio.com",
      projectId: "marpk-816dd",
      storageBucket: "marpk-816dd.firebasestorage.app",
      messagingSenderId: "189644122232",
      appId: "1:189644122232:web:ed7894f1510a373d44658d"
    };

    let db = null;
    try {
      firebase.initializeApp(firebaseConfig);
      db = firebase.firestore();
    } catch(e) { console.warn("Firebase error:", e); }

    const STORAGE_KEY = 'PIXA_FIRESTORE_DATA_V2';
    const PERMANENT_STORAGE_KEY = 'PIXA_YEAR_IN_PIXELS_PERMANENT_DATA';
    let currentYear = 2026;
    let activeTrackerId = 1;
    let selectedDateForPick = null;
    let mainTab = 'pixels';

    let pixaData = {
      trackers: [
        {
          id: 1,
          title: "Pasos 👟",
          keys: [
            { id: 1, label: "- 4000", color: "#b492cd" },
            { id: 2, label: "5k-6k", color: "#5fa89b" },
            { id: 3, label: "8k-10k", color: "#e0a3cc" },
            { id: 4, label: "10k+", color: "#a4dbd0" }
          ],
          years: { 2026: {} }
        }
      ]
    };

    function loadData() {
      try {
        let raw = localStorage.getItem(PERMANENT_STORAGE_KEY) || localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          const oldKeys = [
            'PIXA_YEAR_IN_PIXELS_PERMANENT_DATA',
            'PIXA_YEAR_IN_PIXELS_V1', 'PIXA_YEAR_IN_PIXELS_V2', 'PIXA_YEAR_IN_PIXELS_V3', 
            'PIXA_YEAR_IN_PIXELS_V4', 'PIXA_YEAR_IN_PIXELS_V5', 'PIXA_YEAR_IN_PIXELS_V6', 
            'PIXA_YEAR_IN_PIXELS_V7', 'PIXA_YEAR_IN_PIXELS_V8', 'PIXA_YEAR_IN_PIXELS_V9',
            'PIXA_YEAR_IN_PIXELS_V10', 'PIXA_YEAR_IN_PIXELS_V11'
          ];
          for (let k of oldKeys) {
            raw = localStorage.getItem(k);
            if (raw) {
              pixaData = JSON.parse(raw);
              break;
            }
          }
        } else {
          pixaData = JSON.parse(raw);
        }
      } catch (e) {}

      if (db) {
        db.collection('mary_pixa').doc('main_data').onSnapshot((doc) => {
          if (doc.exists) {
            const val = doc.data();
            if (val && val.trackers && val.trackers.length > 0) {
              pixaData = val;
              localStorage.setItem(PERMANENT_STORAGE_KEY, JSON.stringify(pixaData));
              renderAll();
            }
          } else {
            if (pixaData && pixaData.trackers && pixaData.trackers.length > 0) {
              saveData();
            }
          }
        });
      }
    }

    function saveData() {
      localStorage.setItem(PERMANENT_STORAGE_KEY, JSON.stringify(pixaData));
      localStorage.setItem(STORAGE_KEY, JSON.stringify(pixaData));
      if (db) {
        db.collection('mary_pixa').doc('main_data').set(pixaData)
          .catch(err => console.log("Error en Firestore:", err));
      }
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      if(!t) return;
      t.innerText = msg;
      t.classList.remove('opacity-0', 'translate-y-4');
      t.classList.add('opacity-100', 'translate-y-0');
      setTimeout(() => {
        t.classList.remove('opacity-100', 'translate-y-0');
        t.classList.add('opacity-0', 'translate-y-4');
      }, 2000);
    }

    function init() {
      loadData();
      
      const today = new Date();
      const yyyy = today.getFullYear();
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const fromEl = document.getElementById('stats-from');
      const toEl = document.getElementById('stats-to');
      if(fromEl) fromEl.value = `${yyyy}-${mm}-01`;
      if(toEl) toEl.value = today.toISOString().slice(0, 10);

      renderAll();

      const colorInput = document.getElementById('key-input-color');
      if(colorInput) {
        colorInput.addEventListener('input', (e) => {
          const hex = document.getElementById('key-color-hex');
          if(hex) hex.innerText = e.target.value;
        });
      }
    }

    function changeYear(delta) {
      currentYear += delta;
      const yrLabel = document.getElementById('current-year-label');
      if(yrLabel) yrLabel.innerText = currentYear;
      renderAll();
    }

    function switchMainTab(tab) {
      mainTab = tab;
      const vPix = document.getElementById('view-pixels');
      const vStat = document.getElementById('view-stats');
      const btnPix = document.getElementById('nav-tab-pixels');
      const btnStat = document.getElementById('nav-tab-stats');

      if (tab === 'pixels') {
        if(vPix) vPix.classList.remove('hidden');
        if(vStat) vStat.classList.add('hidden');
        if(btnPix) btnPix.classList.add('active');
        if(btnStat) btnStat.classList.remove('active');
      } else {
        if(vPix) vPix.classList.add('hidden');
        if(vStat) vStat.classList.remove('hidden');
        if(btnStat) btnStat.classList.add('active');
        if(btnPix) btnPix.classList.remove('active');
        renderStats();
      }
    }

    function openModal(id) { 
      const el = document.getElementById(id);
      if(el) el.classList.remove('hidden'); 
    }
    
    function closeModal(id) { 
      const el = document.getElementById(id);
      if(el) el.classList.add('hidden'); 
    }

    function renderAll() {
      renderPillsBar();
      renderActiveTrackerView();
      if(mainTab === 'stats') renderStats();
    }

    function renderPillsBar() {
      const bar = document.getElementById('trackers-pills-bar');
      if(!bar) return;
      bar.innerHTML = '';
      pixaData.trackers.forEach(t => {
        const isActive = t.id === activeTrackerId;
        bar.innerHTML += `
          <button onclick="setActiveTracker(${t.id})" class="px-3 py-1.5 rounded-2xl text-xs font-extrabold whitespace-nowrap transition cursor-pointer ${isActive ? 'bg-[#b492cd] text-white shadow-xs' : 'bg-white text-stone-600 border border-[#ebd7e3]'}" style="${isActive ? '' : ''}">
            ${t.title}
          </button>`;
      });
    }

    function setActiveTracker(id) {
      activeTrackerId = id;
      renderAll();
    }

    function renderActiveTrackerView() {
      const tracker = pixaData.trackers.find(t => t.id === activeTrackerId);
      if (!tracker) return;

      const titleInput = document.getElementById('active-tracker-title');
      if(titleInput) titleInput.value = tracker.title;
      
      const yearLog = (tracker.years && tracker.years[currentYear]) || {};
      const filledCount = Object.keys(yearLog).length;
      const countEl = document.getElementById('active-tracker-count');
      if(countEl) countEl.innerText = `${filledCount} días registrados`;

      const keysContainer = document.getElementById('tracker-keys-container');
      if(keysContainer) {
        keysContainer.innerHTML = '';
        tracker.keys.forEach(k => {
          keysContainer.innerHTML += `
            <div class="flex items-center space-x-1.5 bg-white px-2 py-0.5 rounded-xl border border-[#ebd7e3] text-[11px] font-black text-stone-700 shadow-xs">
              <span class="w-2.5 h-2.5 rounded-full" style="background-color: ${k.color}"></span>
              <span>${k.label}</span>
              <button onclick="deleteKey(${k.id})" class="text-stone-300 hover:text-red-400 font-bold ml-1 cursor-pointer">×</button>
            </div>`;
        });
      }

      const rowsContainer = document.getElementById('pixel-rows');
      if(!rowsContainer) return;
      rowsContainer.innerHTML = '';

      if (!tracker.years) tracker.years = {};
      if (!tracker.years[currentYear]) tracker.years[currentYear] = {};

      const now = new Date();
      const realYear = now.getFullYear();
      const realMonth = now.getMonth() + 1;
      const realDay = now.getDate();

      for (let day = 1; day <= 31; day++) {
        let rowHtml = `<div style="display: grid; grid-template-columns: repeat(13, minmax(0, 1fr)); gap: 3px; align-items: center;">`;
        rowHtml += `<div class="text-[9px] font-black text-stone-400 text-right pr-1">${day}</div>`;

        for (let month = 1; month <= 12; month++) {
          const daysInMonth = new Date(currentYear, month, 0).getDate();
          if (day > daysInMonth) {
            rowHtml += `<div class="pixel-cell opacity-0 pointer-events-none"></div>`;
          } else {
            const dateKey = `${month}-${day}`;
            const color = yearLog[dateKey] || '';
            const style = color ? `background-color: ${color};` : '';
            
            const isToday = (currentYear === realYear && month === realMonth && day === realDay);
            const todayClass = isToday ? 'pixel-today' : '';
            const bgClass = color ? '' : 'pixel-empty';

            rowHtml += `
              <div onclick="openPickColorModal(${month}, ${day})" 
                   class="pixel-cell ${bgClass} ${todayClass}" 
                   style="${style}" 
                   title="${day}/${month}/${currentYear} ${isToday ? '(Hoy)' : ''}">
              </div>`;
          }
        }
        rowHtml += `</div>`;
        rowsContainer.innerHTML += rowHtml;
      }
    }

    function updateTrackerTitle(val) {
      const tracker = pixaData.trackers.find(t => t.id === activeTrackerId);
      if (tracker && val.trim()) {
        tracker.title = val.trim();
        saveData();
        renderPillsBar();
        showToast("✨ Título actualizado");
      }
    }

    function deleteCurrentTracker() {
      if (pixaData.trackers.length <= 1) {
        alert("Debes tener al menos un log.");
        return;
      }
      if (confirm("¿Segura que deseas eliminar este log?")) {
        pixaData.trackers = pixaData.trackers.filter(t => t.id !== activeTrackerId);
        activeTrackerId = pixaData.trackers[0].id;
        saveData();
        renderAll();
        showToast("🗑️ Log eliminado");
      }
    }

    function openNewTrackerModal() {
      const input = document.getElementById('new-tracker-name');
      if(input) input.value = '';
      openModal('modal-new-tracker');
    }

    function createNewTracker() {
      const input = document.getElementById('new-tracker-name');
      const name = input ? input.value.trim() : '';
      if (!name) return;
      const newId = Date.now();
      pixaData.trackers.push({
        id: newId,
        title: name,
        keys: [
          { id: 1, label: "Nivel 1", color: "#b492cd" },
          { id: 2, label: "Nivel 2", color: "#5fa89b" }
        ],
        years: { [currentYear]: {} }
      });
      saveData();
      closeModal('modal-new-tracker');
      activeTrackerId = newId;
      renderAll();
      showToast("✨ ¡Nuevo log creado!");
    }

    function openAddKeyModal() {
      const input = document.getElementById('key-input-label');
      if(input) input.value = '';
      openModal('modal-key-edit');
    }

    function saveKeyItem() {
      const input = document.getElementById('key-input-label');
      const label = input ? input.value.trim() : '';
      const colorInput = document.getElementById('key-input-color');
      const color = colorInput ? colorInput.value : '#b492cd';
      if (!label) return;

      const tracker = pixaData.trackers.find(t => t.id === activeTrackerId);
      if (tracker) {
        tracker.keys.push({ id: Date.now(), label, color });
        saveData();
        closeModal('modal-key-edit');
        renderActiveTrackerView();
        showToast("✨ Categoría guardada");
      }
    }

    function deleteKey(keyId) {
      const tracker = pixaData.trackers.find(t => t.id === activeTrackerId);
      if (tracker) {
        tracker.keys = tracker.keys.filter(k => k.id !== keyId);
        saveData();
        renderActiveTrackerView();
        showToast("🗑️ Categoría eliminada");
      }
    }

    function openPickColorModal(m, d) {
      selectedDateForPick = `${m}-${d}`;
      const monthNames = ["Ene", "Feb", "Mar", "Abr", "May", "Jun", "Jul", "Ago", "Sep", "Oct", "Nov", "Dic"];
      const dateLabel = document.getElementById('pick-date-label');
      if(dateLabel) dateLabel.innerText = `${d} de ${monthNames[m-1]} ${currentYear}`;

      const tracker = pixaData.trackers.find(t => t.id === activeTrackerId);
      const list = document.getElementById('modal-keys-list');
      if(!list) return;
      list.innerHTML = '';

      if (!tracker || tracker.keys.length === 0) {
        list.innerHTML = `<p class="text-xs text-stone-400 text-center py-2">Agrega primero una categoría con "+ Color"</p>`;
      } else {
        tracker.keys.forEach(k => {
          list.innerHTML += `
            <div onclick="applyColorToDay('${k.color}')" class="flex items-center space-x-3 p-2.5 bg-[#f7faf8] hover:bg-stone-100 rounded-2xl cursor-pointer border border-[#e2ede7] transition">
              <span class="w-5 h-5 rounded-lg shadow-xs" style="background-color: ${k.color}"></span>
              <span class="text-xs font-black text-stone-800">${k.label}</span>
            </div>`;
        });
      }

      openModal('modal-pick-color');
    }

    function applyColorToDay(color) {
      const tracker = pixaData.trackers.find(t => t.id === activeTrackerId);
      if (tracker && selectedDateForPick) {
        if (!tracker.years[currentYear]) tracker.years[currentYear] = {};
        tracker.years[currentYear][selectedDateForPick] = color;
        saveData();
        closeModal('modal-pick-color');
        renderActiveTrackerView();
        showToast("✨ ¡Guardado con éxito!");
      }
    }

    function clearPixelDay() {
      const tracker = pixaData.trackers.find(t => t.id === activeTrackerId);
      if (tracker && selectedDateForPick && tracker.years[currentYear]) {
        delete tracker.years[currentYear][selectedDateForPick];
        saveData();
        closeModal('modal-pick-color');
        renderActiveTrackerView();
        showToast("🗑️ Día borrado");
      }
    }

    // --- ESTADÍSTICAS & GRÁFICOS (DONA + BARRAS) ---
    function renderStats() {
      const fromEl = document.getElementById('stats-from');
      const toEl = document.getElementById('stats-to');
      if(!fromEl || !toEl) return;
      const fromStr = fromEl.value;
      const toStr = toEl.value;
      
      const donutContainer = document.getElementById('donut-chart-container');
      const breakdownContainer = document.getElementById('stats-breakdown-container');
      const badge = document.getElementById('stats-total-logged-badge');
      const titleEl = document.getElementById('stats-tracker-name-title');

      const tracker = pixaData.trackers.find(t => t.id === activeTrackerId);
      if (!tracker) return;

      if(titleEl) titleEl.innerText = tracker.title;
      if(breakdownContainer) breakdownContainer.innerHTML = '';

      const yearLog = (tracker.years && tracker.years[currentYear]) || {};

      let totalDaysInRange = 0;
      let loggedDaysInRange = 0;
      let colorCounts = {};

      tracker.keys.forEach(k => colorCounts[k.color] = { label: k.label, count: 0, color: k.color });

      if (fromStr && toStr) {
        let curr = new Date(fromStr + 'T00:00:00');
        let end = new Date(toStr + 'T00:00:00');

        while (curr <= end) {
          totalDaysInRange++;
          const m = curr.getMonth() + 1;
          const d = curr.getDate();
          const dateKey = `${m}-${d}`;
          const col = yearLog[dateKey];

          if (col) {
            loggedDaysInRange++;
            if (colorCounts[col]) colorCounts[col].count++;
          }
          curr.setDate(curr.getDate() + 1);
        }
      }

      if(badge) badge.innerText = `${loggedDaysInRange} regs.`;

      if (loggedDaysInRange === 0) {
        if(donutContainer) donutContainer.style.background = '#ebd7e3';
        const centerPct = document.getElementById('donut-center-pct');
        if(centerPct) centerPct.innerText = '0%';
        if(breakdownContainer) breakdownContainer.innerHTML = `<p class="text-xs text-stone-400 text-center py-4">No hay píxeles pintados en este rango de fechas.</p>`;
        return;
      }

      let gradientStops = [];
      let currentDeg = 0;

      Object.values(colorCounts).forEach(item => {
        if (item.count > 0) {
          const angle = (item.count / loggedDaysInRange) * 360;
          const nextDeg = currentDeg + angle;
          gradientStops.push(`${item.color} ${currentDeg}deg ${nextDeg}deg`);
          currentDeg = nextDeg;
        }
      });

      if (donutContainer) {
        if (gradientStops.length > 0) {
          donutContainer.style.background = `conic-gradient(${gradientStops.join(', ')})`;
        } else {
          donutContainer.style.background = '#ebd7e3';
        }
      }

      const centerPct = document.getElementById('donut-center-pct');
      if(centerPct) centerPct.innerText = `${loggedDaysInRange}d`;

      if(breakdownContainer) {
        Object.values(colorCounts).forEach(item => {
          const pct = ((item.count / loggedDaysInRange) * 100).toFixed(1);
          breakdownContainer.innerHTML += `
            <div class="space-y-1.5 text-xs bg-white/60 p-3 rounded-2xl border border-[#ebd7e3]">
              <div class="flex justify-between items-center">
                <div class="flex items-center space-x-2">
                  <span class="w-3 h-3 rounded-md" style="background-color: ${item.color}"></span>
                  <span class="font-black text-stone-800">${item.label}</span>
                </div>
                <span class="font-black text-stone-600">${item.count} días <span class="text-stone-400 font-bold">(${pct}%)</span></span>
              </div>
              <div class="w-full bg-[#f0e6ed] h-2 rounded-full overflow-hidden">
                <div class="h-full rounded-full transition-all duration-500" style="width: ${pct}%; background-color: ${item.color}"></div>
              </div>
            </div>`;
        });
      }
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
